name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The security suite tests SQL, so it needs real Postgres with pgvector.
    # Mocking the database here would test nothing: the access predicate IS
    # the query.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assetcues_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/assetcues_test
      OPENAI_API_KEY: not-used-tests-use-deterministic-fake-embeddings
      SUPABASE_JWT_SECRET: test-secret
      ENVIRONMENT: development
      # The security suite drops every table. Safe here: the database is a
      # throwaway service container that dies with the job.
      ALLOW_DESTRUCTIVE_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy app

      - name: Migrations apply cleanly from scratch
        run: alembic upgrade head

      - name: Migrations are reversible
        run: alembic downgrade base && alembic upgrade head

      - name: Tests (including the RBAC red-team suite)
        run: pytest -q --tb=short

      - name: Export OpenAPI schema
        run: |
          python -c "import json; from app.main import create_app; \
            print(json.dumps(create_app().openapi(), indent=2))" > openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
