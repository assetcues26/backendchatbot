name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The security suite tests SQL, so it needs real Postgres with pgvector.
    # Mocking the database here would test nothing: the access predicate IS
    # the query.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assetcues_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/assetcues_ci
      # The security suite reads this one, never DATABASE_URL, and refuses to
      # run if the two are equal. Both point at the same throwaway service
      # container here, which dies with the job -- but they are still separate
      # databases, because the guard is only worth having if CI exercises it.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/assetcues_test
      OPENAI_API_KEY: not-used-tests-use-deterministic-fake-embeddings
      SUPABASE_JWT_SECRET: test-secret
      ENVIRONMENT: development
      ALLOW_DESTRUCTIVE_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # DATABASE_URL and TEST_DATABASE_URL must be two different databases or
      # the security suite refuses to run, so create the second one. Both are
      # in the same throwaway container; the point is that CI exercises the
      # same separation the runbook asks a human for.
      - name: Create the working database beside the scratch one
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d assetcues_test -c 'CREATE DATABASE assetcues_ci'

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy app

      - name: Migrations apply cleanly from scratch
        run: alembic upgrade head

      - name: Migrations are reversible
        run: alembic downgrade base && alembic upgrade head

      - name: Tests (including the RBAC red-team suite)
        run: pytest -q --tb=short

      - name: Export OpenAPI schema
        run: |
          python -c "import json; from app.main import create_app; \
            print(json.dumps(create_app().openapi(), indent=2))" > openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
